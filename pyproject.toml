[project]
name = "movie-graph"
version = "0.1.0"
description = "Movie recommendation system based on graphs"
authors = [
    {name = "Denys Nikieienko"}
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "django (>=5.2,<5.3)",
    "djangorestframework (>=3.18.3,<4.0.0)",
    "django-filter (>=26.2,<27.0)",
    "django-cors-headers (>=4.9.0,<5.0.0)",
    "psycopg[binary] (>=3.3.8,<4.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "celery[redis] (>=5.7.0,<6.0.0)",
    "django-redis (>=7.0.0,<8.0.0)",
    "networkx (>=3.7,<4.0)",
    "numpy (>=2.5.4,<3.0.0)",
    "scipy (>=1.18.1,<2.0.0)",
    "scikit-learn (>=1.9.1,<2.0.0)",
    "pandas (>=3.1.1,<4.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "beautifulsoup4 (>=4.15.0,<5.0.0)",
    "lxml (>=6.1.3,<7.0.0)",
    "pillow (>=13.0.0,<14.0.0)",
    "whitenoise (>=6.12.0,<7.0.0)",
    "gunicorn (>=27.0.0,<28.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-django (>=4.14.0,<5.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "factory-boy (>=3.3.3,<4.0.0)",
    "ruff (>=0.17.4,<0.18.0)"
]

[tool.poetry]
package-mode = false
